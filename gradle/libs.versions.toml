[versions]
guice = "7.0.0"
reactor = "1.2.9"
slf4j = "2.0.16"

[libraries]
annotations = { module = "org.jetbrains:annotations", version = "16.0.2" }
guice-core = { module = "com.google.inject:guice", version.ref = "guice" } # https://github.com/google/guice
guice-ext-throwingproviders = { module = "com.google.inject.extensions:guice-throwingproviders", version.ref = "guice" }
tencentcloud-tmt-sdk = { module = "com.tencentcloudapi:tencentcloud-sdk-java-tmt", version = "3.1.1353" }
evo-inflector = { module = "org.atteo:evo-inflector", version = "1.3" }
fastjson = { module = "com.alibaba.fastjson2:fastjson2", version = "2.0.56" }
junit = { module = "org.junit.jupiter:junit-jupiter", version = "5.12.0" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
methanol = { module = "com.github.mizosoft.methanol:methanol", version = "1.8.1" } # https://github.com/mizosoft/methanol/
reactor-netty-core = { module = "io.projectreactor.netty:reactor-netty-core", version.ref = "reactor" }
reactor-netty-http = { module = "io.projectreactor.netty:reactor-netty-http", version.ref = "reactor" }
overflow = { module = "top.mrxiaom.mirai:overflow-core", version = "1.0.8" } # https://github.com/MrXiaoM/Overflow
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
discord4j = { module = "com.discord4j:discord4j-core", version = "3.3.0" } # https://github.com/Discord4J/Discord4J
jsoup = { module = "org.jsoup:jsoup", version = "1.21.2" } # https://jsoup.org/
guava = { module = "com.google.guava:guava", version = "33.5.0-jre" } # https://github.com/google/guava
lightbend-config = { module = "com.typesafe:config", version = "1.4.4" } # https://github.com/lightbend/config

[bundles]
reactorNetty = ["reactor-netty-core", "reactor-netty-http"]
slf4j = ["slf4j-api", "slf4j-simple"]